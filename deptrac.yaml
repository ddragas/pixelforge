# Which part of the application may depend on which.
# The arrows point one way: HTTP and jobs call the services; the services
# hold the logic; the repositories are the only ones that reach the database
# and the Pixelforge layer the only one that reaches Pixelforge. Nothing
# points back up.
deptrac:
  paths:
    - ./app
  layers:
    - name: Http
      collectors:
        - type: classLike
          value: ^App\\Http\\.*
    - name: Console
      collectors:
        - type: classLike
          value: ^App\\Console\\.*
    - name: Jobs
      collectors:
        - type: classLike
          value: ^App\\Jobs\\.*
    - name: Services
      collectors:
        - type: classLike
          value: ^App\\Services\\.*
    - name: Repositories
      collectors:
        - type: classLike
          value: ^App\\Repositories\\.*
    - name: Events
      collectors:
        - type: classLike
          value: ^App\\Events\\.*
    - name: Listeners
      collectors:
        - type: classLike
          value: ^App\\Listeners\\.*
    - name: Pixelforge
      collectors:
        - type: classLike
          value: ^App\\Pixelforge\\.*
    - name: Models
      collectors:
        - type: classLike
          value: ^App\\Models\\.*
    - name: Enums
      collectors:
        - type: classLike
          value: ^App\\Enums\\.*
    - name: Support
      collectors:
        - type: classLike
          value: ^App\\Support\\.*
    - name: Providers
      collectors:
        - type: classLike
          value: ^App\\Providers\\.*
  ruleset:
    Http: [Services, Repositories, Pixelforge, Jobs, Models, Enums, Support]
    Console: [Services, Repositories, Pixelforge, Models, Enums]
    Jobs: [Services, Repositories, Pixelforge, Models, Enums]
    Services: [Repositories, Pixelforge, Events, Models, Enums, Support]
    Listeners: [Events, Models, Enums]
    Events: [Models]
    Repositories: [Models, Enums]
    Pixelforge: [Support]
    Models: [Enums]
    Enums: []
    Support: []
    Providers: []
